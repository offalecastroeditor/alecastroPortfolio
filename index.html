<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexandre Castro — Video Editor</title>
<meta name="description" content="Video editor for YouTubers, creators and brands. Pick a portfolio: Minecraft, Games or Social.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Barlow:wght@400;500;700&family=Barlow+Condensed:ital,wght@1,800&family=Schibsted+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D7263D;
  --red-hot:#FF4D62;
  --bg:#070506;
  --text:#FFFFFF;
  --muted:#B8B8B8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color:var(--text);
  background:radial-gradient(ellipse at 50% 0%, #2a0d13 0%, var(--bg) 60%) fixed, var(--bg);
  -webkit-font-smoothing:antialiased;
}
main{max-width:560px;margin:0 auto;padding:72px 16px 48px;text-align:center}

.avatar{
  width:160px;height:160px;border-radius:50%;margin:0 auto 28px;
  border:6px solid #000;background:#000;overflow:hidden;
  box-shadow:0 0 40px rgba(215,38,61,.55);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:700;letter-spacing:-.01em}
.role{margin-top:8px;color:var(--muted);font-size:1.1rem}

/* um botão por portfólio, cada um no estilo da sua página */
.hub{display:flex;flex-direction:column;gap:22px;margin:44px 0 64px}
.hub a{
  display:block;text-decoration:none;color:#fff;
  transition:transform .3s ease, box-shadow .3s ease, background-color .3s ease;
}
.hub small{display:block;margin-top:4px;font-family:"Barlow", sans-serif;font-weight:500;font-size:.85rem;letter-spacing:0;text-shadow:none;opacity:.85}

/* Minecraft: bloco pixelado com bisel */
.b-mc{
  font-family:"Pixelify Sans", "Courier New", monospace;font-weight:700;font-size:1.5rem;
  background:var(--red);border:4px solid #000;padding:16px 20px;
  box-shadow:inset -4px -4px 0 #A91B30, inset 4px 4px 0 #F2556A, 6px 6px 0 #000;
  text-shadow:2px 2px 0 #8E1426;
}
.b-mc:hover{
  background:#E8324A;transform:translate(-2px,-2px);
  box-shadow:inset -4px -4px 0 #B81F35, inset 4px 4px 0 #FF6E80, 8px 8px 0 #000, 0 0 28px rgba(255,77,98,.6);
}

/* Games: condensada itálica, sombra dura */
.b-games{
  font-family:"Barlow Condensed", "Barlow", sans-serif;font-style:italic;font-weight:800;
  font-size:1.7rem;letter-spacing:.04em;text-transform:uppercase;
  background:#171113;border:3px solid var(--red);border-radius:8px;padding:14px 20px;
  box-shadow:5px 5px 0 #000;
}
.b-games:hover{
  background:var(--red);border-color:#000;transform:translate(-2px,-2px);
  box-shadow:7px 7px 0 #000, 0 0 28px rgba(255,77,98,.6);
}

/* Social: pílula clara, limpa */
.b-social{
  font-family:"Schibsted Grotesk", system-ui, sans-serif;font-weight:700;font-size:1.3rem;
  background:#ECEEF1;color:#1E2635 !important;border-radius:999px;padding:16px 20px;
}
.b-social:hover{background:#fff;transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.4)}

.hub a:focus-visible,.contact a:focus-visible,.contact button:focus-visible{outline:3px solid var(--red-hot);outline-offset:4px}

.contact h2{font-size:1.5rem;font-weight:700}
.contact p{margin-top:8px;color:var(--muted)}
.contact-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}
.contact-btns a,.contact-btns button{
  font:inherit;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;
  color:#fff;background:transparent;border:2px solid #3a2a2e;border-radius:8px;padding:10px 18px;
  transition:border-color .3s ease, background-color .3s ease;
}
.contact-btns a:hover,.contact-btns button:hover{border-color:var(--red);background:rgba(215,38,61,.15)}

footer{margin-top:56px;font-size:13px;color:#666}

@media (prefers-reduced-motion:reduce){.hub a{transition:none}.hub a:hover{transform:none}}
</style>
</head>
